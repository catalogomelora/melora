name: Generar catalogo.csv
on:
  push:
    branches: [main]
    paths: ['productos.js']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node generate-csv.js
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add catalogo.csv
          git diff --cached --quiet || git commit -m "Actualizar catalogo.csv"
          git push
